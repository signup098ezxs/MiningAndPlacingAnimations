# Pushing a tag like "v2.0.0+26.2" builds the mod and publishes a GitHub Release
# with the mod jar attached (much easier to download than workflow artifacts).

name: release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jar=$(ls build/libs/*.jar | grep -v -- '-sources')
          gh release create "$GITHUB_REF_NAME" $jar \
            --title "Mining & Placing Animations ${GITHUB_REF_NAME#v} (unofficial 26.2 port)" \
            --notes-file .github/RELEASE_NOTES.md
